name: Advanced Policy Research

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Bootstrap refits for decision stability"
        required: false
        default: "200"
      folds:
        description: "Cross-fitting folds"
        required: false
        default: "5"
  push:
    paths:
      - "training/advanced_policy_research.py"
      - "src/evaluation/**"
      - "src/models/uplift/**"
      - "src/policy/frontier.py"
      - "data/raw/hillstrom_raw.csv"
      - "requirements.txt"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: pip install -r requirements.txt

      - name: Validate Python modules\n        run: python -m compileall -q dashboard src training\n\n      - name: Run advanced policy research
        env:
          BOOTSTRAP: ${{ github.event.inputs.bootstrap || '200' }}
          FOLDS: ${{ github.event.inputs.folds || '5' }}
        run: PYTHONPATH="$GITHUB_WORKSPACE" python -m training.advanced_policy_research --folds "$FOLDS" --bootstrap "$BOOTSTRAP"

      - name: Commit research results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/advanced_policy/
          if git diff --cached --quiet; then
            echo "No research artifact changes to commit."
          else
            git commit -m "Update advanced policy research results"
            git push
          fi

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: acdx-advanced-policy-research
          path: reports/advanced_policy/
          retention-days: 90
